# .github/dependabot.yml
# Dependabot version updates — managed PRs are validated by the
# `dependabot-checks` CircleCI workflow before merge.
version: 2
updates:
  # JavaScript dependencies (pm pnpm, lockfile pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "user:felixshiftellecon"
    # Group low-risk bumps into a single PR each.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      # React/Next are tightly coupled — keep them on the same PR so
      # upgrade PRs don't conflict with each other.
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@types/react*"